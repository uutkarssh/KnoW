<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KnoW">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>KnoW — Sign In</title>
  <meta name="description" content="Sign in to KnoW — the free all-in-one AI platform.">
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC4sVc6U-JkCpRXvAXnATwjXPW1QVF0i9o",
      authDomain: "know-48f47.firebaseapp.com",
      projectId: "know-48f47",
      storageBucket: "know-48f47.firebasestorage.app",
      messagingSenderId: "469730284840",
      appId: "1:469730284840:web:68ae2c3fc5accc2a726c1d",
      measurementId: "G-YZ1T42MP2C"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body class="auth-body">

  <!-- NAVBAR (logo only) -->
  <nav class="navbar">
    <a href="index.html" class="logo">KnoW</a>
  </nav>

  <!-- AUTH CONTAINER -->
  <div class="auth-container">

    <div class="auth-box">

      <!-- Heading -->
      <h1 class="auth-heading">Sign in to KnoW<span class="dot">.</span></h1>
      <p class="auth-sub">Free. No subscription. Just sign in.</p>

      <!-- Error message -->
      <div class="auth-error" id="authError"></div>

      <!-- Google Sign-In -->
      <button class="auth-google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <!-- Divider -->
      <div class="auth-divider">
        <span class="auth-divider-line"></span>
        <span class="auth-divider-text">or</span>
        <span class="auth-divider-line"></span>
      </div>

      <!-- Email + Password Form -->
      <div class="auth-form" id="authForm">
        <input
          type="text"
          class="auth-input"
          id="nameInput"
          placeholder="Full name"
          style="display:none"
          autocomplete="name"
        >
        <input
          type="email"
          class="auth-input"
          id="emailInput"
          placeholder="Email address"
          autocomplete="email"
        >
        <input
          type="password"
          class="auth-input"
          id="passwordInput"
          placeholder="Password"
          autocomplete="current-password"
        >
        <button class="auth-submit-btn" id="submitBtn">Sign In</button>
      </div>

      <!-- Toggle Sign In / Sign Up -->
      <p class="auth-toggle">
        <span id="toggleText">Don't have an account?</span>
        <button class="auth-toggle-btn" id="toggleBtn">Create one</button>
      </p>

    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {

      const auth = firebase.auth();
      let isSignUp = false;

      const nameInput   = document.getElementById('nameInput');
      const emailInput  = document.getElementById('emailInput');
      const passInput   = document.getElementById('passwordInput');
      const submitBtn   = document.getElementById('submitBtn');
      const toggleBtn   = document.getElementById('toggleBtn');
      const toggleText  = document.getElementById('toggleText');
      const googleBtn   = document.getElementById('googleBtn');
      const errorBox    = document.getElementById('authError');

      // Redirect if already signed in
      auth.onAuthStateChanged(function (user) {
        if (user) window.location.href = 'index.html';
      });

      // Show error
      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      // Toggle sign-in / sign-up mode
      toggleBtn.addEventListener('click', function () {
        isSignUp = !isSignUp;
        clearError();
        if (isSignUp) {
          nameInput.style.display = 'block';
          submitBtn.textContent = 'Create Account';
          toggleText.textContent = 'Already have an account?';
          toggleBtn.textContent = 'Sign in';
          passInput.setAttribute('autocomplete', 'new-password');
          passInput.placeholder = 'Create a password';
        } else {
          nameInput.style.display = 'none';
          submitBtn.textContent = 'Sign In';
          toggleText.textContent = "Don't have an account?";
          toggleBtn.textContent = 'Create one';
          passInput.setAttribute('autocomplete', 'current-password');
          passInput.placeholder = 'Password';
        }
      });

      // Email / Password submit
      submitBtn.addEventListener('click', function () {
        clearError();
        const email = emailInput.value.trim();
        const pass  = passInput.value;
        const name  = nameInput.value.trim();

        if (!email || !pass) {
          showError('Please enter your email and password.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = isSignUp ? 'Creating...' : 'Signing in...';

        if (isSignUp) {
          auth.createUserWithEmailAndPassword(email, pass)
            .then(function (result) {
              if (name) {
                return result.user.updateProfile({ displayName: name });
              }
            })
            .then(function () {
              window.location.href = 'index.html';
            })
            .catch(function (err) {
              showError(friendlyError(err.code));
              submitBtn.disabled = false;
              submitBtn.textContent = 'Create Account';
            });
        } else {
          auth.signInWithEmailAndPassword(email, pass)
            .then(function () {
              window.location.href = 'index.html';
            })
            .catch(function (err) {
              showError(friendlyError(err.code));
              submitBtn.disabled = false;
              submitBtn.textContent = 'Sign In';
            });
        }
      });

      // Enter key submits
      [emailInput, passInput, nameInput].forEach(function (el) {
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') submitBtn.click();
        });
      });

      // Google Sign-In
      googleBtn.addEventListener('click', function () {
        clearError();
        var provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider)
          .then(function () {
            window.location.href = 'index.html';
          })
          .catch(function (err) {
            showError(friendlyError(err.code));
          });
      });

      // Convert Firebase error codes to readable messages
      function friendlyError(code) {
        var map = {
          'auth/invalid-email':            'Please enter a valid email address.',
          'auth/user-not-found':           'No account found with this email.',
          'auth/wrong-password':           'Incorrect password. Try again.',
          'auth/email-already-in-use':     'An account with this email already exists.',
          'auth/weak-password':            'Password must be at least 6 characters.',
          'auth/too-many-requests':        'Too many attempts. Please try again later.',
          'auth/popup-closed-by-user':     'Sign-in popup was closed. Please try again.',
          'auth/network-request-failed':   'Network error. Check your connection.',
          'auth/invalid-credential':       'Invalid email or password.',
        };
        return map[code] || 'Something went wrong. Please try again.';
      }

    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
